<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactieve voorbeelden · Concepten die je zelf ontdekt</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --text: #e2e8f0;
      --muted: #64748b;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(148, 163, 184, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background-color: var(--bg-color);
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(59,130,246,0.10) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 10%, rgba(168,85,247,0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 100%, rgba(34,197,94,0.06) 0%, transparent 50%);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px 64px;
      line-height: 1.5;
    }

    header {
      max-width: 760px;
      margin: 0 auto 12px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 12px;
      background: linear-gradient(135deg, #3b82f6, #a855f7, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin: 0 0 18px;
    }

    .lead {
      max-width: 600px;
      margin: 0 auto 44px;
      text-align: center;
      color: #94a3b8;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 980px;
      margin: 0 auto;
    }

    /* Category section heading */
    .section-head {
      max-width: 980px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .section-head:not(:first-of-type) { margin-top: 52px; }
    .section-head h2 {
      font-size: 1.15rem;
      margin: 0;
      color: var(--text);
      white-space: nowrap;
    }
    .section-head .tag {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .section-head .rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(148,163,184,0.28), transparent);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      border-radius: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    /* Accent strip along the top, colour set per-card via --accent */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent, #3b82f6);
      opacity: 0.9;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      border-color: color-mix(in srgb, var(--accent, #3b82f6) 50%, transparent);
    }
    .card:focus-visible {
      outline: 2px solid var(--accent, #3b82f6);
      outline-offset: 3px;
    }

    .icon {
      font-size: 2rem;
      line-height: 1;
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent, #3b82f6) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent, #3b82f6) 30%, transparent);
    }

    .card h2 {
      font-size: 1.2rem;
      margin: 0;
      color: var(--text);
    }

    .card p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.92rem;
      flex: 1;
    }

    .go {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent, #3b82f6);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.18s ease;
    }
    .card:hover .go { gap: 11px; }

    footer {
      max-width: 980px;
      margin: 48px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer .more {
      display: inline-block;
      margin-top: 4px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px dashed rgba(148, 163, 184, 0.25);
    }
  </style>
</head>
<body>

<header>
  <h1>Interactieve voorbeelden</h1>
  <p class="subtitle">Concepten die je zelf ontdekt</p>
</header>
<p class="lead">
  Kleine, op zichzelf staande visualisaties die telkens één idee uitleggen.
  Schuif, sleep en speel — en zie waarom de wereld soms anders werkt dan je verwacht.
</p>

<main id="sections"></main>

<footer>
  <span class="more">Meer voorbeelden volgen…</span>
</footer>

<script>
  // Eén item per voorbeeld. Nieuw voorbeeld toevoegen? Voeg hier een regel toe.
  const examples = [
    {
      file: 'exponential-growth.html',
      icon: '🦠',
      title: 'De val van exponentiële groei',
      tagline: 'Een pot is op minuut 60 vol — en op minuut 59 nog maar halfvol. Ontdek waarom we exponentiële groei altijd te laat zien aankomen.',
      accent: '#22c55e',
    },
    {
      file: 'three-door-problem.html',
      icon: '🚪',
      title: 'Het driedeurenprobleem',
      tagline: 'Drie deuren, één auto, twee geiten. Waarom verdubbelt wisselen je winkans van 1⁄3 naar 2⁄3?',
      accent: '#d9a534',
    },
    {
      file: 'birthday-paradox.html',
      icon: '🎂',
      title: 'De verjaardagenparadox',
      tagline: 'Hoeveel mensen heb je nodig voor een gedeelde verjaardag? Verrassend weinig — al bij 23 is het een muntworp.',
      accent: '#ec4899',
    },
    {
      file: 'compound-interest.html',
      icon: '📈',
      title: 'Samengestelde interest',
      tagline: 'Wie wint: wie vroeg begint, of wie drie keer zoveel inlegt? Ontdek waarom de curve het werk doet, niet de storting.',
      accent: '#f59e0b',
    },
    {
      file: 'simpsons-paradox.html',
      icon: '📊',
      title: 'De paradox van Simpson',
      tagline: 'Elke klas gaat omhoog, maar samen gaan ze omlaag. Sleep de wolken en zie de trendlijn omklappen.',
      accent: '#22d3ee',
    },
    {
      file: 'false-positive-paradox.html',
      icon: '🩺',
      title: 'De vals-positieve val',
      tagline: 'Een test die 99% accuraat is voor een zeldzame ziekte zit tóch meestal fout als hij "positief" zegt. Hoe kan dat?',
      accent: '#ef4444',
    },
    {
      file: 'schelling-segregation.html',
      icon: '🏘️',
      title: "Schelling's segregatiemodel",
      tagline: 'Iedereen is prima met andere buren — een héél kleine voorkeur al — en tóch ontstaat scherpe segregatie.',
      accent: '#fb923c',
    },
    {
      file: 'survivorship-bias.html',
      icon: '✈️',
      title: 'Overlevingsbias',
      tagline: 'De gaten in teruggekeerde gevechtsvliegtuigen zaten juist op de plekken die je níét moet bepantseren.',
      accent: '#38bdf8',
    },
    {
      file: 'evolution-of-trust.html',
      icon: '🤝',
      title: 'De evolutie van vertrouwen',
      tagline: 'Bedriegen loont altijd — tot je dezelfde speler morgen wéér tegenkomt. Eén schuifje bepaalt of bedriegers of samenwerkers de wereld overnemen.',
      accent: '#a78bfa',
    },
    {
      file: 'double-pendulum.html',
      icon: '🦋',
      title: 'De dubbele slinger',
      tagline: 'Twee identieke slingers, een duizendste graad verschil — raad hoe lang ze samen blijven.',
      accent: '#818cf8',
    },
    {
      file: 'coastline-paradox.html',
      icon: '🌊',
      title: 'De kustlijnparadox',
      tagline: 'Hoe lang is een kust? Pak een kortere meetlat en hij groeit — zonder einde.',
      accent: '#2dd4bf',
    },
    {
      file: 'regression-to-the-mean.html',
      icon: '🎢',
      title: 'Regressie naar het gemiddelde',
      tagline: 'Prijs je beste leerlingen en ze zakken, berisp de slechtsten en ze stijgen — straft het lot je vriendelijkheid?',
      accent: '#84cc16',
    },
    {
      file: 'benfords-law.html',
      icon: '🔍',
      title: 'De wet van Benford',
      tagline: 'Echte getallen beginnen met een 1, verzonnen getallen niet — zo vangt het eerste cijfer fraudeurs.',
      accent: '#e879f9',
    },
    {
      file: 'moire-patterns.html',
      icon: '🌀',
      title: 'Het moiré-effect',
      tagline: 'Twee stilstaande rasters van saaie lijntjes — draai er één een halve graad en er golven plots reuzenbanden over die in geen van beide bestaan.',
      accent: '#c084fc',
    },
    {
      file: 'shepard-tone.html',
      icon: '🎚️',
      title: 'De Shepard-toon',
      tagline: 'Een toon die eindeloos blijft stijgen zonder ooit hoger te worden — de kapperspaal voor je oren. Klik en luister.',
      accent: '#f472b6',
    },
    {
      file: 'phantom-traffic-jam.html',
      icon: '🚗',
      title: 'De spookfile',
      tagline: 'Geen ongeluk, geen afslag — toch sta je stil. Eén remstoot wordt een schokgolf die naar achteren kruipt terwijl iedereen vooruit rijdt.',
      accent: '#f97316',
    },
    {
      file: 'pid-controller.html',
      icon: '🎯',
      title: 'De PID-regelaar',
      tagline: 'Hetzelfde trucje stuurt je thermostaat, cruise control én een zwevende drone — en de kunst is niet hard sturen, maar op tijd remmen.',
      accent: '#fcd34d',
    },
    {
      file: 'cellular-automata.html',
      icon: '🔲',
      title: 'Een nieuw soort wetenschap',
      tagline: 'Eén byte legt de hele natuurwet vast. Start Regel 30 met één zwarte cel — en zie pure willekeur ontstaan uit acht regeltjes.',
      accent: '#06b6d4',
    },
    {
      file: 'cors-explained.html',
      icon: '🛂',
      title: 'CORS: de poortwachter van je browser',
      tagline: 'Je server stuurt keurig 200 OK — toch ziet je JavaScript niets. Niet de server blokkeert, maar je eigen browser. Stel een aanroep samen en zie waar het misgaat.',
      accent: '#0ea5e9',
      category: 'Techniek',
    },
    {
      file: 'kansverdeling-volleybal.html',
      icon: '🏐',
      title: 'Kansverdeling van een best-of-5',
      tagline: 'Racing is favoriet (0,65 per set) — tóch duurt de wedstrijd bijna even vaak 3, 4 of 5 sets. Reken stap voor stap mee.',
      accent: '#a855f7',
      category: 'Kennisbank',
    },
  ];

  // Categorie-metadata: label + korte tag per sectie op de landingspagina.
  const categoryMeta = {
    'Animaties':  { tag: 'Speel & ontdek', icon: '🎛️' },
    'Techniek':   { tag: 'Onder de motorkap', icon: '⚙️' },
    'Kennisbank': { tag: 'Stap voor stap', icon: '📚' },
  };

  // Groepeer per categorie (eerste-gezien-volgorde); voorbeelden zonder categorie vallen onder 'Animaties'.
  const sections = document.getElementById('sections');
  const order = [];
  const groups = {};
  examples.forEach(ex => {
    const cat = ex.category || 'Animaties';
    if (!groups[cat]) { groups[cat] = []; order.push(cat); }
    groups[cat].push(ex);
  });

  order.forEach(cat => {
    const meta = categoryMeta[cat] || {};

    const head = document.createElement('div');
    head.className = 'section-head';
    const h2 = document.createElement('h2');
    h2.textContent = (meta.icon ? meta.icon + ' ' : '') + cat;
    head.appendChild(h2);
    if (meta.tag) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = meta.tag;
      head.appendChild(tag);
    }
    const rule = document.createElement('span');
    rule.className = 'rule';
    head.appendChild(rule);
    sections.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[cat].forEach(ex => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = ex.file;
      card.style.setProperty('--accent', ex.accent);

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = ex.icon;

      const cardTitle = document.createElement('h2');
      cardTitle.textContent = ex.title;

      const p = document.createElement('p');
      p.textContent = ex.tagline;

      const go = document.createElement('span');
      go.className = 'go';
      go.textContent = 'Bekijk voorbeeld →';

      card.append(icon, cardTitle, p, go);
      grid.appendChild(card);
    });
    sections.appendChild(grid);
  });
</script>
</body>
</html>
